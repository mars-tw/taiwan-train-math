name: Observe Crack phone SWANGLE cold and warm

on:
  workflow_dispatch:
    inputs:
      release_id:
        type: string
        required: true
        default: '405931912'
      manifest_sha:
        type: string
        required: true
        default: df97cd9b9742228e5c55ebced2adedcc9b29dfa356eb28386487615f5c87d82c

      proof_phase:
        type: choice
        required: true
        default: cold_warm
        options: [cold_warm, menu_start, root_visible_start]
      approval_release_id:
        type: string
        required: false
        description: Dedicated Root-owned approval DRAFT ID for root_visible_start only
      root_menu_sha:
        type: string
        required: true
        default: f8d470c1f1342fccc34eb52fe3667ca99ca2c3bed16ef8ca292a4bd304ae64e4

permissions:
  contents: read
concurrency:
  group: crack-phone-swangle-proof
  cancel-in-progress: false

jobs:
  fetch:
    if: github.repository == 'mars-tw/taiwan-train-math' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Relay only original immutable Crack input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          MANIFEST_SHA: ${{ inputs.manifest_sha }}
        run: |
          test "$RELEASE_ID" = '405931912'
          test "$MANIFEST_SHA" = 'df97cd9b9742228e5c55ebced2adedcc9b29dfa356eb28386487615f5c87d82c'
          python3 scripts/android-native-store-capture/fetch_inputs.py --release-id "$RELEASE_ID" --manifest-sha "$MANIFEST_SHA" --project crackveil-vanguard --directory "$RUNNER_TEMP/native-capture-input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crack-original-input-${{ github.run_id }}
          path: ${{ runner.temp }}/native-capture-input
          retention-days: 1
          if-no-files-found: error

  observe:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # Required to read the private DRAFT; token only passed to approval controller.
      actions: read
    env:
      NATIVE_AVD_NAME: NativeCapturePhone_${{ github.run_id }}_crackveil-vanguard
      PROOF_PHASE: ${{ inputs.proof_phase }}
      ROOT_MENU_REVIEW_SHA: ${{ inputs.root_menu_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crack-original-input-${{ github.run_id }}
          path: ${{ runner.temp }}/native-capture-input
      - name: Install declared fresh-CI dependencies
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-crack-swangle-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends python3-pil libvulkan1 libgl1 libpulse0 tesseract-ocr tesseract-ocr-chi-tra
      - name: Prepare exact official SDK inside this run only
        run: python3 scripts/godot-android-swangle/bootstrap_sdk.py
      - name: Fail closed on binary, package, mode or dependency mismatch
        run: python3 scripts/godot-android-swangle/sdk_preflight.py
      - name: Create only the known owned phone after backend guard passes
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | "$ISOLATED_AVDMANAGER" create avd --name "$NATIVE_AVD_NAME" --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          python3 scripts/android-native-store-capture/device_config.py --name "$NATIVE_AVD_NAME" --family phone
      - name: Existing cold/warm or OCR menu-start observation
        if: inputs.proof_phase != 'root_visible_start'
        run: python3 scripts/godot-android-swangle/observe.py
      - name: Start owned driver and wait only for its new fresh native menu
        if: inputs.proof_phase == 'root_visible_start'
        run: python3 scripts/godot-android-swangle/root_visible_exchange.py launch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.proof_phase == 'root_visible_start'
        with:
          name: crack-root-visible-menu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/godot-swangle-preflight/fresh-clean-menu.png
            output/godot-swangle-preflight/fresh-clean-menu-raw-native.png
            output/godot-swangle-preflight/fresh-clean-menu.xml
            output/godot-swangle-preflight/root-visible-request.json
            output/godot-swangle-preflight/native-observation.json
          if-no-files-found: error
          retention-days: 30
      - name: Fixed official GET for one Root approval; no native command in this process
        if: inputs.proof_phase == 'root_visible_start'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_RELEASE_ID: ${{ inputs.approval_release_id }}
        run: python3 scripts/godot-android-swangle/root_visible_exchange.py poll --approval-release-id "$APPROVAL_RELEASE_ID"
      - name: Observe same driver completion; post20 and warm90 unchanged
        if: inputs.proof_phase == 'root_visible_start'
        run: python3 scripts/godot-android-swangle/root_visible_exchange.py finish
      - name: Clean up only recorded run-owned driver/emulator identities
        if: always() && inputs.proof_phase == 'root_visible_start'
        run: python3 scripts/godot-android-swangle/root_visible_exchange.py cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crack-swangle-preflight-${{ github.run_id }}
          path: output/godot-swangle-preflight
          retention-days: 30
          if-no-files-found: warn
