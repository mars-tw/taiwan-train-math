name: Observe exact Seven build8 Android KVM explicitSWANGLE runtime

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: seven-code8-android-kvm-runtime
  cancel-in-progress: false

jobs:
  fetch:
    if: github.repository == 'mars-tw/taiwan-train-math' && github.ref == 'refs/heads/codex/ashes-simulator-recording'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write # Existing token reads private DRAFT; reader performs GET only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: GET only fixed private Seven8 APK and verify exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/seven-android-runtime/fetch_input.py --directory "$RUNNER_TEMP/seven-code8-input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-code8-fixed-input-${{ github.run_id }}
          path: ${{ runner.temp }}/seven-code8-input
          retention-days: 1
          if-no-files-found: error

  observe:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: seven-code8-fixed-input-${{ github.run_id }}
          path: ${{ runner.temp }}/seven-code8-input
      - name: Require actual KVM on disposable hosted Linux runner
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-seven-code8-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends python3-pil python3-opencv libvulkan1 libgl1 libpulse0 tesseract-ocr tesseract-ocr-chi-tra
      - name: Provision one isolated canonical official SDK; no owner SDK changes
        run: python3 scripts/seven-android-runtime/bootstrap_sdk.py
      - name: One explicitSWANGLE KVM boot and normal UI-input session; no game-state injection
        run: python3 scripts/seven-android-runtime/run_probe.py
      - name: Preserve original native frames/video and diagnostic receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-code8-android-runtime-${{ github.run_id }}
          path: output/seven-code8-runtime
          retention-days: 14
          if-no-files-found: warn
