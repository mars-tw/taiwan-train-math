name: Verify compiled iPad app
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Native build run containing apple-app-packages
        required: true
        default: '37458546306'
permissions:
  contents: read
  actions: read
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Retrieve the actual previously compiled app
        run: |
          test "$SOURCE_RUN" -gt 0
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name apple-app-packages --dir output/compiled-apple
          mkdir -p output/ipad-app
          ditto -x -k output/compiled-apple/TrainMath-simulator.app.zip output/ipad-app
          codesign --force --deep --sign - output/ipad-app/App.app
          codesign --verify --deep --strict output/ipad-app/App.app
      - name: Launch a fresh iPad Pro and record actual UI
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          import sharp from 'sharp';
          const run=(args,timeout=180000)=>execFileSync('xcrun',['simctl',...args],{encoding:'utf8',timeout,maxBuffer:8*1024*1024});
          const inventory=JSON.parse(run(['list','--json']));
          const runtime=inventory.runtimes.find(r=>r.isAvailable&&!r.availabilityError&&r.version==='26.2');
          if(!runtime) throw new Error('Verified iOS 26.2 runtime is missing');
          const types=inventory.devicetypes.filter(t=>/^iPad Pro/.test(t.name)&&/13-inch/.test(t.name));
          const type=types.find(t=>/M4/.test(t.name));
          if(!type) throw new Error('A supported iPad Pro 13-inch M4 model is required');
          const name=`TrainMath-iPad-${process.env.GITHUB_RUN_ID}`;
          const udid=run(['create',name,type.identifier,runtime.identifier]).trim();
          if(!/^[A-F0-9-]{36}$/i.test(udid)) throw new Error('Invalid newly created iPad identifier');
          const out='output/ipad-verification'; await mkdir(out,{recursive:true});
          let stage='boot'; const report={sourceRun:process.env.SOURCE_RUN,appId:'tw.mars.trainmath',device:type.name,runtime:runtime.version,actualSimulator:true,adHocSimulatorSigning:true};
          try {
            run(['boot',udid]); run(['bootstatus',udid,'-b'],600000);
            run(['ui',udid,'appearance','light']);
            run(['status_bar',udid,'override','--time','9:41','--batteryState','charged','--batteryLevel','100']);
            stage='install'; run(['install',udid,'output/ipad-app/App.app'],360000);
            stage='launch'; report.launch=run(['launch',udid,'tw.mars.trainmath'],360000).trim();
            await new Promise(r=>setTimeout(r,30000));
            stage='screenshot'; run(['io',udid,'screenshot',`${out}/ipad-simulator-home.png`]);
            const m=await sharp(`${out}/ipad-simulator-home.png`).metadata(); report.width=m.width;report.height=m.height;
            run(['terminate',udid,'tw.mars.trainmath']);run(['launch',udid,'tw.mars.trainmath'],360000);
            await new Promise(r=>setTimeout(r,12000));
            run(['io',udid,'screenshot',`${out}/ipad-simulator-relaunch.png`]);
            report.status='completed'; report.tested=['install','launch','relaunch','screenshots'];
          } catch(error) { report.status='failed'; report.stage=stage; report.error=String(error.message).slice(0,1500);throw error; }
          finally { try {run(['shutdown',udid]);}catch{}; report.notTested=['physical device','speaker output','interactive gameplay']; await writeFile(`${out}/ipad-launch.json`,JSON.stringify(report,null,2)); }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: ipad-ui-verification, path: output/ipad-verification, retention-days: 14}
