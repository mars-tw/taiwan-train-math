name: Rift Forge iOS QA IPA from pinned Unity export (manual, no store upload)
on:
  workflow_dispatch:
permissions:
  contents: write # read a draft source Release and attach exact-run QA evidence there
concurrency:
  group: rift-ios-qa-a853100-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mars-tw/taiwan-train-math' && github.ref_name == 'main'
    runs-on: macos-15
    timeout-minutes: 90
    environment: game-store-rift-forge-3d
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SOURCE_TAG: rift-ios-qa-a853100-20261013
      SOURCE_ZIP: RiftForge-iOS-qa-build1-source-a853100.zip
      SOURCE_MANIFEST: rift-ios-qa-build1-source-manifest-a853100.json
      SOURCE_TRANSFORM: rift-ios-qa-brand-transform-20261013.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check fixed runner and workflow inputs before any signing secret
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild" || { echo 'Pinned Xcode 26.3 unavailable'; exit 1; }
          xcodebuild -version
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          assert os.environ['GITHUB_REPOSITORY']=='mars-tw/taiwan-train-math'
          verifier=pathlib.Path('scripts/rift_ios_qa_verify.py')
          signer=pathlib.Path('scripts/rift-ios-qa-sign.sh')
          assert verifier.is_file() and signer.is_file()
          assert subprocess.run(['python3','-m','py_compile',str(verifier)]).returncode==0
          print('Trusted Rift QA verifier and signer are present; no external source executed yet')
          PY
          python3 -m unittest -v tests/test_rift_ios_qa_verify.py
      - name: Fetch fixed draft Release inputs and verify every Unity export file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rift-input"
          gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > "$RUNNER_TEMP/rift-release.json"
          python3 - <<'PY'
          import json,os,pathlib
          obj=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'rift-release.json').read_text())
          if obj.get('isDraft') is not True or obj.get('tagName')!='rift-ios-qa-a853100-20261013':
              raise SystemExit('Rift source Release must be the fixed draft tag')
          PY
          for name in "$SOURCE_ZIP" "$SOURCE_MANIFEST" "$SOURCE_TRANSFORM"; do
            gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" \
              --dir "$RUNNER_TEMP/rift-input"
          done
          python3 scripts/rift_ios_qa_verify.py source \
            --zip "$RUNNER_TEMP/rift-input/$SOURCE_ZIP" \
            --manifest "$RUNNER_TEMP/rift-input/$SOURCE_MANIFEST" \
            --transform "$RUNNER_TEMP/rift-input/$SOURCE_TRANSFORM" \
            --destination "$RUNNER_TEMP/rift-source" \
            --receipt "$RUNNER_TEMP/rift-source-verification.json"
      - name: Try unsigned simulator compile without Apple signing secrets
        run: |
          set +e
          xcodebuild -project "$RUNNER_TEMP/rift-source/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rift-simulator-derived" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/rift-simulator.log" 2>&1
          code=$?
          SIM_RESULT="$RUNNER_TEMP/rift-simulator-result.json" SIM_CODE="$code" python3 - <<'PY'
          import json,os,pathlib
          code=int(os.environ['SIM_CODE'])
          pathlib.Path(os.environ['SIM_RESULT']).write_text(json.dumps({
              'attempted':True,'result':'COMPILED' if code==0 else 'UNSUPPORTED_OR_FAILED',
              'exitCode':code,'launched':False,'physicalDeviceTested':False},indent=2)+'\n')
          print('Simulator compile '+('succeeded' if code==0 else 'failed; device archive will be assessed separately'))
          PY
          exit 0
      - name: Recheck pinned source immediately before exposing Rift signing secrets
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          checks={
              'RiftForge-iOS-qa-build1-source-a853100.zip':'a0b19a40c84a4caf0f652a6cf3cb4fa632a8598becbe1f04e78a3c29ffe3bdc3',
              'rift-ios-qa-build1-source-manifest-a853100.json':'70501a00e369fd784942739fbc774270b63ba33796a1b2485a46241b3b27e3ae',
              'rift-ios-qa-brand-transform-20261013.json':'d23b0152e8aa7075d9ddd1ea1721e74ee6f489c835e741ffdba1c1846a9337f9'}
          for name,sha in checks.items():
              path=root/'rift-input'/name
              if not path.is_file() or path.is_symlink(): raise SystemExit('Pinned input missing or linked')
              with path.open('rb') as stream:
                  if hashlib.file_digest(stream,'sha256').hexdigest()!=sha: raise SystemExit('Pinned input changed')
          receipt=json.loads((root/'rift-source-verification.json').read_text())
          if receipt.get('sourceVerified') is not True or receipt.get('sourceCommit')!='a85310033f3d035b12b0721582f1e85aa56767ad' or receipt.get('build')!=1 or receipt.get('storeReady') is not False:
              raise SystemExit('Source verification receipt differs')
          print('Rift source provenance rechecked; release gate remains false')
          PY
      - name: Archive, sign and verify device QA IPA without App Store upload
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RIFT_PROJECT_DIR: ${{ runner.temp }}/rift-source
          RIFT_OUTPUT_DIR: ${{ runner.temp }}/rift-output
          RIFT_VERIFY_SCRIPT: ${{ github.workspace }}/scripts/rift_ios_qa_verify.py
        run: bash scripts/rift-ios-qa-sign.sh
      - name: Show bounded Xcode diagnostics if compilation or signing fails
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/rift-output/archive.log" "$RUNNER_TEMP/rift-output/export.log" "$RUNNER_TEMP/rift-simulator.log"; do
            if [ -f "$log" ]; then
              echo "Diagnostics from $(basename "$log")"
              tail -n 80 "$log" | sed -E 's#(/Users/[^/]+/)[^ /]+#\1[PATH]#g'
            fi
          done
      - name: Attach exact-run signed QA IPA and receipts to the same draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,time,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          out=root/'rift-output'
          receipt=json.loads((out/'verification.json').read_text())
          source=json.loads((root/'rift-source-verification.json').read_text())
          if (receipt.get('status')!='SIGNED_QA_IPA_VERIFIED' or not receipt.get('codesignVerified')
              or not receipt.get('entitlementsVerified') or not receipt.get('arm64Verified')
              or receipt.get('physicalDeviceTested') is not False or receipt.get('storeUploaded') is not False
              or receipt.get('storeReady') is not False or source.get('sourceVerified') is not True):
              raise SystemExit('Rift signed QA evidence is incomplete')
          run_id=os.environ['GITHUB_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*',run_id): raise SystemExit('Invalid run ID')
          members={
              'signed-qa.ipa':out/'signed-qa.ipa',
              'verification.json':out/'verification.json',
              'ipa-structure-verification.json':out/'ipa-structure-verification.json',
              'source-verification.json':root/'rift-source-verification.json',
              'simulator-result.json':root/'rift-simulator-result.json'}
          manifest=[]
          for name,path in sorted(members.items()):
              if not path.is_file() or path.is_symlink(): raise SystemExit('Missing or linked QA evidence')
              with path.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
              manifest.append({'name':name,'bytes':path.stat().st_size,'sha256':digest})
          ipa_record=next(item for item in manifest if item['name']=='signed-qa.ipa')
          if ipa_record['sha256']!=receipt['ipaSha256'] or ipa_record['bytes']!=receipt['ipaBytes']:
              raise SystemExit('IPA hash differs from signing receipt')
          summary={'projectId':'rift-forge-3d','sourceCommit':source['sourceCommit'],
                   'runId':run_id,'version':'1.0.0','build':1,'members':manifest,
                   'physicalDeviceTested':False,'storeUploaded':False,'storeReady':False}
          summary_path=out/'evidence-manifest.json'
          summary_path.write_text(json.dumps(summary,indent=2)+'\n')
          members[summary_path.name]=summary_path
          evidence=out/('rift-ios-qa-evidence-'+run_id+'.zip')
          with zipfile.ZipFile(evidence,'x',compression=zipfile.ZIP_STORED,allowZip64=True) as package:
              for name,path in sorted(members.items()): package.write(path,name)
          with evidence.open('rb') as stream: sha=hashlib.file_digest(stream,'sha256').hexdigest()
          if not 0<evidence.stat().st_size<500*1024**2: raise SystemExit('Evidence ZIP outside expected size bound')
          tag='rift-ios-qa-a853100-20261013'
          repo=os.environ['GITHUB_REPOSITORY']
          def release():
              result=subprocess.run(['gh','release','view',tag,'--repo',repo,'--json','isDraft,tagName,assets'],capture_output=True,check=True,text=True,timeout=60)
              return json.loads(result.stdout)
          before=release()
          if before.get('isDraft') is not True or before.get('tagName')!=tag or evidence.name in {x.get('name') for x in before.get('assets',[])}:
              raise SystemExit('Draft Release changed or same-run evidence already exists')
          journal=out/'release-upload-once.json'
          with journal.open('x') as handle:
              json.dump({'runId':run_id,'asset':evidence.name,'bytes':evidence.stat().st_size,'sha256':sha,'state':'ATTEMPTING_ONCE'},handle,indent=2)
              handle.write('\n');handle.flush();os.fsync(handle.fileno())
          subprocess.run(['gh','release','upload',tag,str(evidence),'--repo',repo],check=True,timeout=900)
          item=None
          for _ in range(3):
              after=release()
              assets={x.get('name'):x for x in after.get('assets',[])}
              item=assets.get(evidence.name)
              if item and item.get('digest')=='sha256:'+sha: break
              time.sleep(2)
          if after.get('isDraft') is not True or not item or item.get('size')!=evidence.stat().st_size or item.get('digest')!='sha256:'+sha:
              raise SystemExit('Evidence asset readback incomplete; inspect before any retry')
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as page:
              page.write('Rift Forge iOS QA IPA signed and archived only. No App Store upload; physical QA pending.\n')
              page.write('Evidence ZIP SHA-256: '+sha+'\n')
          print('Exact-run Rift QA evidence uploaded to draft Release, readback verified; no store operation')
          PY
