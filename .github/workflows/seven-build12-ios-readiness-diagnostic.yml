name: Seven District build 12 iOS startup diagnosis (manual, no signing)

'on':
  workflow_dispatch: null

permissions:
  contents: write

concurrency:
  group: seven-build12-ios-readiness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mars-tw/taiwan-train-math' && github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SOURCE_PIN: 867ecfdcb80cd328767f2a07889fe5edeee3b14eace3dda6ee74a9eebb006261
    steps:
      - name: Read only reviewed diagnostic tools from this main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_seven_ios_build12_export.sh
            scripts/ci_seven_build12_readiness.py
            scripts/ci_seven_build12_diagnostic_package.py
            scripts/ci_verify_seven_build12.py
          sparse-checkout-cone-mode: false
      - name: Fetch original exact build 12 source without Apple secrets
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          CI_INPUT: ${{ runner.temp }}/seven-build12-diagnostic-input
          APP_SOURCE: ${{ runner.temp }}/seven-build12-diagnostic-source
          PUBLIC_OUTPUT: ${{ runner.temp }}/seven-build12-diagnostic-output
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          repo='mars-tw/taiwan-train-math';tag='seven-build12-ios-qa-20261013';release_id=411589059
          expected={'SHA256SUMS':'867ecfdcb80cd328767f2a07889fe5edeee3b14eace3dda6ee74a9eebb006261',
            'SevenDistrict-1.0.0-build12-unsigned-source.zip':'d0fe0b07d6e3b2d0c98a7dd56d097dc6339262da9da713d4a44d9d5fc8e55e32',
            'seven-district-reckoning-build12-source-verification.json':'e5dfdd68b48a50a9b8b5421e7cb17c02dedb90ae9a634b239976c4a51c02ffb9',
            'ci_verify_seven_build12.py':'227ebdf6ff1bd7d36c72140b37759642956f98471751c83c6042f432cdcc829b'}
          if (os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_REF'],os.environ['GITHUB_EVENT_NAME'])!=(repo,'refs/heads/main','workflow_dispatch'):
              raise SystemExit('Trusted manual main run required')
          def gh(*args,timeout=90):
              result=subprocess.run(['gh',*args],capture_output=True,timeout=timeout)
              if result.returncode:raise SystemExit('Pinned draft read/download failed; output withheld')
              return result.stdout
          release=json.loads(gh('api','--method','GET',f'repos/{repo}/releases/{release_id}'))
          if release.get('id')!=release_id or release.get('tag_name')!=tag or release.get('draft') is not True:
              raise SystemExit('Original approved draft Release differs')
          assets={item.get('name'):item for item in release.get('assets',[]) if isinstance(item,dict)}
          if not set(expected).issubset(assets):raise SystemExit('Original source assets are missing')
          stage=pathlib.Path(os.environ['CI_INPUT'])
          if stage.exists() or stage.is_symlink():raise SystemExit('Fresh diagnostic stage required')
          stage.mkdir(mode=0o700)
          for name,digest in expected.items():
              asset=assets[name]
              gh('release','download',tag,'--repo',repo,'--pattern',name,'--dir',str(stage),timeout=300)
              file=stage/name
              maximum=1024**3 if name.endswith('.zip') else 1024**2
              if (not file.is_file() or file.is_symlink() or not 0<file.stat().st_size<=maximum
                  or file.stat().st_size!=asset.get('size') or asset.get('digest')!='sha256:'+digest):
                  raise SystemExit('Original draft asset metadata differs')
              with file.open('rb') as data:
                  if hashlib.file_digest(data,'sha256').hexdigest()!=digest:
                      raise SystemExit('Original draft asset SHA differs')
          entries={}
          for line in (stage/'SHA256SUMS').read_text(encoding='ascii').splitlines():
              match=re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]{0,150})',line)
              if not match or match[2] in entries:raise SystemExit('Malformed approved source manifest')
              entries[match[2]]=match[1]
          if any(entries.get(name)!=sha for name,sha in expected.items() if name!='SHA256SUMS'):
              raise SystemExit('Original source manifest tuple differs')
          tool_hashes={
            'scripts/ci_seven_ios_build12_export.sh':'0a84253226cb4ae8be063511553f6fbc1fa0910258f6f41e59431041032c7ba8',
            'scripts/ci_seven_build12_readiness.py':'88b398cb85f56be27d955892328c1d523da3ce6043214b4aaf2e90745ea3de1e',
            'scripts/ci_seven_build12_diagnostic_package.py':'e8772e5e0b24c8feeb37b1ea05674c5fc35ec3379705eea5497fc3b089bd93ca',
            'scripts/ci_verify_seven_build12.py':'227ebdf6ff1bd7d36c72140b37759642956f98471751c83c6042f432cdcc829b'}
          if not re.fullmatch(r'[0-9a-f]{40}',os.environ['GITHUB_SHA']):
              raise SystemExit('Exact diagnostic tools commit required')
          for name,digest in tool_hashes.items():
              file=pathlib.Path(name)
              if not file.is_file() or file.is_symlink():
                  raise SystemExit('Checked-out diagnostic tool is missing or linked')
              with file.open('rb') as data:
                  if hashlib.file_digest(data,'sha256').hexdigest()!=digest:
                      raise SystemExit('Checked-out diagnostic tool differs from reviewed SHA-256')
          if tool_hashes['scripts/ci_verify_seven_build12.py']!=expected['ci_verify_seven_build12.py']:
              raise SystemExit('Checked-out verifier differs from approved Release helper')
          provenance={'repository':repo,'releaseTag':tag,'releaseId':release_id,
            'sourcePin':expected['SHA256SUMS'],
            'sourceCommit':'f6fc1155b0296f74972775a0426af25af4e04416',
            'captureToolsCommit':os.environ['GITHUB_SHA'],'captureToolSha256':tool_hashes,
            'appleSecretsUsed':False,'storeUploadPerformed':False}
          (stage/'diagnostic-provenance.json').write_text(json.dumps(provenance,indent=2)+'\n',encoding='utf-8')
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as env:
              for key in ('CI_INPUT','APP_SOURCE','PUBLIC_OUTPUT'):
                  env.write(key+'='+os.environ[key]+'\n')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as output:
              output.write('source_verified=true\n')
          print('Original 47-file build 12 source and verifier pinned; no signer secrets used')
          PY
      - name: Extract and verify the unchanged 47-file source
        id: extract
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          mkdir -p "$PUBLIC_OUTPUT"
          python3 scripts/ci_verify_seven_build12.py source \
            --zip "$CI_INPUT/SevenDistrict-1.0.0-build12-unsigned-source.zip" \
            --metadata "$CI_INPUT/seven-district-reckoning-build12-source-verification.json" \
            --project seven-district-reckoning --root "$APP_SOURCE" \
            --output "$PUBLIC_OUTPUT/source-verification.json"
      - name: Build unsigned Simulator and observe bounded cold and relaunch startup
        id: capture
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          bash scripts/ci_seven_ios_build12_export.sh diagnose "$APP_SOURCE" \
            seven-district-reckoning "$PUBLIC_OUTPUT/diagnostic" \
            "$CI_INPUT/seven-district-reckoning-build12-source-verification.json"
      - name: Preserve bounded success or failure evidence on the same draft Release
        if: ${{ always() && steps.fetch.outputs.source_verified == 'true' && steps.extract.outcome == 'success' && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          python3 scripts/ci_seven_build12_diagnostic_package.py \
            --input "$CI_INPUT" --output "$PUBLIC_OUTPUT" \
            --capture-outcome "$CAPTURE_OUTCOME" --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" --upload
      - name: Remove only this diagnostic job's temporary source and input
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          for name in ('seven-build12-diagnostic-input','seven-build12-diagnostic-source'):
              target=parent/name
              if target.is_symlink() or target.resolve()==parent or not target.resolve().is_relative_to(parent):
                  raise SystemExit('Unsafe diagnostic cleanup path')
              shutil.rmtree(target,ignore_errors=True)
          PY
