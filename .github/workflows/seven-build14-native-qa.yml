name: Seven District build 14 source-bound native QA (manual, no store upload)

'on':
  workflow_dispatch:
    inputs:
      target:
        description: 'Explicitly select a platform; hold performs no native job'
        required: true
        type: choice
        default: hold
        options: [hold, ios-only, android-only, both]

permissions:
  contents: read

concurrency:
  group: seven-build14-native-qa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mars-tw/taiwan-train-math' && github.ref == 'refs/heads/main' && (inputs.target == 'android-only' || inputs.target == 'both')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # Private, source-bound draft Release after all checks pass.
    steps:
      - name: Read reviewed CI and exact Seven source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mars-tw/seven-district-reckoning
          ref: a5cc913f566189d13ecf39b4229848fec8a43df1
          path: seven-source
          persist-credentials: false
      - name: Verify exact source, clean checkout and build identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C seven-source rev-parse HEAD)" = a5cc913f566189d13ecf39b4229848fec8a43df1
          test -z "$(git -C seven-source status --porcelain)"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('seven-source')
          cfg=json.loads((root/'native/build-config.json').read_text())
          assert (cfg['appId'],cfg['nativeVersion'],cfg['nativeBuild'],cfg['engineVersion'])==('tw.mars.sevendistrictreckoning','1.0.0',14,'4.7.2')
          preset=(root/'godot/export_presets.cfg').read_text()
          assert preset.count('version/code=14')==2 and preset.count('application/version="14"')==1
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Godot and Android tools in an owned writable SDK
        id: android_toolchain
        shell: bash
        run: |
          set -euo pipefail
          vendor_sdk="$ANDROID_HOME"
          owned_sdk="$RUNNER_TEMP/seven-build14-sdk"
          test -f "$vendor_sdk/licenses/android-sdk-license"
          test -f "$vendor_sdk/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$owned_sdk/cmdline-tools"
          cp -a "$vendor_sdk/licenses" "$owned_sdk/licenses"
          cp -a "$vendor_sdk/cmdline-tools/latest" "$owned_sdk/cmdline-tools/latest"
          python3 seven-source/tools/install_native_toolchain.py --output "$RUNNER_TEMP/seven-build14-toolchain" --android-sdk "$owned_sdk"
          "$owned_sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$owned_sdk" --install 'platforms;android-36' 'platform-tools' --channel=0 </dev/null
          test -f "$owned_sdk/platforms/android-36/android.jar"
          test -x "$owned_sdk/build-tools/36.1.0/apksigner"
          python3 - <<'PY'
          import json,os,pathlib
          tool=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build14-toolchain/toolchain.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('SEVEN_GODOT='+tool['godot']+'\nSEVEN_BUNDLETOOL='+tool['bundletool']+'\n')
              env.write('SEVEN_ANDROID_SDK='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build14-sdk')+'\n')
              env.write('ANDROID_HOME='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build14-sdk')+'\n')
              env.write('ANDROID_SDK_ROOT='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build14-sdk')+'\n')
          PY
      - name: Parse and test pinned game on Linux
        id: android_tests
        run: python3 seven-source/tools/test_game.py --godot "$SEVEN_GODOT"
      - name: Scan source for publication hazards
        run: python3 seven-source/tools/scan_publication.py
      - name: Export and inspect Android release APK and AAB without signing
        id: android_export
        shell: bash
        run: |
          set -euo pipefail
          python3 seven-source/tools/export_mobile.py --target android --godot "$SEVEN_GODOT" --jdk "$JAVA_HOME" --android-sdk "$SEVEN_ANDROID_SDK" --bundletool "$SEVEN_BUNDLETOOL"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('seven-source/deliverables/native/android-verification.json')
          r=json.loads(p.read_text())
          assert (r['sourceSha'],r['appId'],r['nativeBuild'],r['status'],r['signed'],r['uploaded'])==('a5cc913f566189d13ecf39b4229848fec8a43df1','tw.mars.sevendistrictreckoning',14,'unsigned-android-verified',False,False)
          assert len(r['packages'])==2
          print(json.dumps({'sourceSha':r['sourceSha'],'build':r['nativeBuild'],'packages':r['packages']}))
          PY
      - name: Independently reject signatures and AAB sensitive permissions
        id: android_independent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess,xml.etree.ElementTree as ET,zipfile
          root=pathlib.Path('seven-source/deliverables/native')
          apk=root/'native-unsigned.apk';aab=root/'native-unsigned.aab'
          signer=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.1.0/apksigner'
          jarsigner=pathlib.Path(os.environ['JAVA_HOME'])/'bin/jarsigner'
          if not signer.is_file() or not jarsigner.is_file():raise SystemExit('Official signing inspectors missing')
          check=subprocess.run([str(signer),'verify','--verbose','--print-certs',str(apk)],capture_output=True,text=True,timeout=90)
          if check.returncode==0:raise SystemExit('APK unexpectedly has a verified v1/v2/v3 signature')
          with zipfile.ZipFile(apk) as archive:
              if any(name.startswith('META-INF/') and name.upper().endswith(('.RSA','.DSA','.EC','.SF')) for name in archive.namelist()):
                  raise SystemExit('APK has a v1 signature record')
              with apk.open('rb') as stream:
                  stream.seek(archive.start_dir-16)
                  if stream.read(16)==b'APK Sig Block 42':raise SystemExit('APK has a v2/v3 signing block')
          jar=subprocess.run([str(jarsigner),'-verify','-strict',str(aab)],capture_output=True,text=True,timeout=90)
          if 'jar is unsigned' not in (jar.stdout+jar.stderr).lower():
              raise SystemExit('AAB did not independently report unsigned JAR content')
          manifest=subprocess.run([str(pathlib.Path(os.environ['JAVA_HOME'])/'bin/java'),'-jar',os.environ['SEVEN_BUNDLETOOL'],
                                   'dump','manifest','--bundle='+str(aab),'--module=base'],
                                  capture_output=True,text=True,timeout=90)
          if manifest.returncode:raise SystemExit('AAB manifest could not be independently inspected')
          xml=ET.fromstring(manifest.stdout)
          namespace='{http://schemas.android.com/apk/res/android}'
          permissions={node.get(namespace+'name') for node in xml
                       if node.tag in {'uses-permission','uses-permission-sdk-23'}}
          forbidden={'android.permission.INTERNET','android.permission.ACCESS_NETWORK_STATE',
                     'android.permission.RECORD_AUDIO','android.permission.CAMERA',
                     'android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION',
                     'android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE',
                     'android.permission.MANAGE_EXTERNAL_STORAGE'}
          if permissions & forbidden:raise SystemExit('Offline AAB unexpectedly requests sensitive permission')
          report={'sourceSha':'a5cc913f566189d13ecf39b4229848fec8a43df1','build':14,
                  'apkApksignerVerifyExitCode':check.returncode,'apkV1RecordsPresent':False,
                  'apkV2V3SigningBlockPresent':False,'aabJarsignerReportedUnsigned':True,
                  'aabPermissions':sorted(permission for permission in permissions if permission),
                  'forbiddenPermissionsPresent':False,'signed':False,'storeUploadPerformed':False}
          (root/'independent-signature-check.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Preserve verified unsigned packages on a private draft Release
        id: android_draft
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/seven-build14-native/publish_draft.py android
      - name: Write current-run Android failure receipt
        if: failure()
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.android_toolchain.outcome }}
          TESTS_OUTCOME: ${{ steps.android_tests.outcome }}
          EXPORT_OUTCOME: ${{ steps.android_export.outcome }}
          INDEPENDENT_OUTCOME: ${{ steps.android_independent.outcome }}
          DRAFT_OUTCOME: ${{ steps.android_draft.outcome }}
        run: python3 ci/scripts/seven-build14-native/diagnose_export.py android
      - name: Preserve bounded Android failure receipts without packages
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-build14-android-failure-${{ github.run_id }}
          path: |
            output/seven-build14-android/early-failure.json
            seven-source/deliverables/native/android-verification.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'mars-tw/taiwan-train-math' && github.ref == 'refs/heads/main' && (inputs.target == 'ios-only' || inputs.target == 'both')
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: write # Private, source-bound draft Release after signature verification.
    environment: game-store-seven-district-reckoning
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Read reviewed CI and exact Seven source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mars-tw/seven-district-reckoning
          ref: a5cc913f566189d13ecf39b4229848fec8a43df1
          path: seven-source
          persist-credentials: false
      - name: Verify exact clean game source before running its export tool
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C seven-source rev-parse HEAD)" = a5cc913f566189d13ecf39b4229848fec8a43df1
          test -z "$(git -C seven-source status --porcelain)"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('seven-source')
          cfg=json.loads((root/'native/build-config.json').read_text())
          assert (cfg['appId'],cfg['nativeVersion'],cfg['nativeBuild'],cfg['engineVersion'])==('tw.mars.sevendistrictreckoning','1.0.0',14,'4.7.2')
          PY
      - name: Install verified official Godot 4.7.2 iOS export template
        shell: bash
        run: |
          set -euo pipefail
          python3 seven-source/tools/install_native_toolchain.py --output "$RUNNER_TEMP/seven-build14-toolchain"
          python3 ci/scripts/seven-build14-native/prepare_macos_toolchain.py \
            "$RUNNER_TEMP/seven-build14-toolchain/toolchain.json" \
            output/seven-build14-ios/toolchain-layout.json
          python3 - <<'PY'
          import json,os,pathlib
          tool=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build14-toolchain/toolchain.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('SEVEN_GODOT='+tool['godot']+'\n')
          PY
      - name: Export exact unsigned Xcode project from pinned Godot source
        id: ios_export
        run: python3 seven-source/tools/export_mobile.py --target ios --source-only --godot "$SEVEN_GODOT"
      - name: Preserve bounded early Godot import/export diagnostics before signing
        if: failure() && steps.ios_export.outcome == 'failure'
        env:
          IOS_EXPORT_OUTCOME: ${{ steps.ios_export.outcome }}
        run: python3 ci/scripts/seven-build14-native/diagnose_export.py ios
      - name: Bind all source files and game PCK to pinned source commit
        id: ios_source
        run: python3 ci/scripts/seven-build14-native/prepare_ios_source.py seven-source output/seven-build14-ios
      - name: Verify Mac source and compile actual unsigned iPhone/iPad simulators
        id: ios_sim
        shell: bash
        run: |
          set -euo pipefail
          bash ci/scripts/seven-build14-native/export_ios.sh prepare seven-source/deliverables/native/ios seven-district-reckoning output/seven-build14-ios output/seven-build14-ios/ios-source-metadata.json
          bash ci/scripts/seven-build14-native/export_ios.sh sim seven-source/deliverables/native/ios seven-district-reckoning output/seven-build14-ios output/seven-build14-ios/ios-source-metadata.json
      - name: Sign and independently verify build 14 IPA without store upload
        id: ios_sign
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/scripts/seven-build14-native/export_ios.sh sign seven-source/deliverables/native/ios seven-district-reckoning output/seven-build14-ios output/seven-build14-ios/ios-source-metadata.json
      - name: Preserve verified signed IPA and QA receipts on a private draft Release
        id: ios_draft
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/seven-build14-native/publish_draft.py ios
      - name: Write current-run iOS failure receipt without signing logs
        if: failure() && steps.ios_export.outcome != 'failure'
        env:
          IOS_EXPORT_OUTCOME: ${{ steps.ios_export.outcome }}
          IOS_SOURCE_OUTCOME: ${{ steps.ios_source.outcome }}
          IOS_SIM_OUTCOME: ${{ steps.ios_sim.outcome }}
          IOS_SIGN_OUTCOME: ${{ steps.ios_sign.outcome }}
          IOS_DRAFT_OUTCOME: ${{ steps.ios_draft.outcome }}
        run: python3 ci/scripts/seven-build14-native/diagnose_export.py ios
      - name: Preserve iOS failure receipts without an IPA
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-build14-ios-failure-${{ github.run_id }}
          path: |
            output/seven-build14-ios/early-export-failure.json
            output/seven-build14-ios/toolchain-layout.json
            output/seven-build14-ios/sim-build-failure.json
            output/seven-build14-ios/sim-runtime-failure.json
            output/seven-build14-ios/ios-source-metadata.json
            output/seven-build14-ios/source-verification.json
            output/seven-build14-ios/simulator-architecture.json
            output/seven-build14-ios/simulator-verification.json
            seven-source/deliverables/native/ios-verification.json
          if-no-files-found: warn
          retention-days: 14
