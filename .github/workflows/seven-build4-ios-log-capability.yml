name: Seven build4 owned log sink capability only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seven-build4-log-capability
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref == 'refs/heads/main' && github.repository == 'mars-tw/taiwan-train-math'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Read only exact fresh Seven build4 DRAFT inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,re,subprocess
          repo='mars-tw/taiwan-train-math';tag='all-games-godot-seven-build4-20261008'
          expected={'SHA256SUMS': '059fd419f23dbcac7a4a56df9ca534604d3aee08634eab32c998a14b0d895c2a', 'SevenDistrict-1.0.0-build4-unsigned-source.zip': 'f20681b369bdd2d451ea537615c8022e2df048bc2b390f660057d46ae0397696', 'seven-district-reckoning-build4-source-verification.json': '9db1c21d3560cfbd1dcf1d2b5fc4eaf9cb1da5c19c1425c0cb5ed6494434b0af', 'ci_verify_seven_build4.py': '46ccdb1bf5a66b3a96cf0603bbf41a82385234d0e056ef128d680b380b1b4dcd', 'ci_seven_ios_build4_export.sh': '3c9d8e7e5439a8d4ee03064e36c79c329700fc58d711cb906a025a9563f83e0c'}
          def gh(args,timeout=60):
              p=subprocess.run(['gh',*args],capture_output=True,timeout=timeout)
              if p.returncode:raise SystemExit('Approved draft read failed; no raw output')
              return p.stdout
          if os.environ['GITHUB_REPOSITORY']!=repo:raise SystemExit('Wrong trusted repository')
          pages=json.loads(gh(['api','--paginate','--slurp','repos/'+repo+'/releases?per_page=100']))
          matches=[r for page in pages for r in page if r.get('tag_name')==tag and r.get('draft') is True]
          if len(matches)!=1:raise SystemExit('Need one exact new Seven-only DRAFT')
          release=matches[0];assets={r['name'] for r in release.get('assets',[])}
          if not set(expected).issubset(assets):raise SystemExit('Missing immutable Seven2 assets')
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build4-log-capability-input';base.mkdir(mode=0o700)
          for filename in expected:gh(['release','download',tag,'--repo',repo,'--pattern',filename,'--dir',str(base)],300)
          for filename,digest in expected.items():
              if hashlib.sha256((base/filename).read_bytes()).hexdigest()!=digest:raise SystemExit('Immutable Seven2 input hash mismatch')
          entries={}
          for line in (base/'SHA256SUMS').read_text().splitlines():
              match=re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9._-]+)',line)
              if not match or match[2] in entries:raise SystemExit('Invalid checksum record')
              entries[match[2]]=match[1]
          if entries!={k:v for k,v in expected.items() if k!='SHA256SUMS'}:raise SystemExit('Unexpected manifest tuple')
          metadata=json.loads((base/'seven-district-reckoning-build4-source-verification.json').read_text())
          if (metadata.get('appId'),metadata.get('nativeVersion'),metadata.get('nativeBuild'))!=('tw.mars.sevendistrictreckoning','1.0.0',4):raise SystemExit('Only exact Seven4 is allowed')
          proof={'repository':repo,'releaseTag':tag,'releaseId':release['id'],'releaseDraft':True,'version':'1.0.0','build':4,'projectId':'seven-district-reckoning','inputSha256':expected,'sourceCommit':'a916e20160a4f0be68dbdbe10ab1ef2b3931e8ac','storeMutation':False}
          (base/'input-provenance.json').write_text(json.dumps(proof,indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-build4-log-capability-input-${{ github.run_id }}
          path: ${{ runner.temp }}/seven-build4-log-capability-input
          retention-days: 1
          if-no-files-found: error
  capability:
    needs: fetch
    runs-on: macos-15-intel
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/seven-ios-log-capability.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: seven-build4-log-capability-input-${{ github.run_id }}
          path: ${{ runner.temp }}/seven-build4-log-input
      - name: Exact input and runner pins before any execution
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build4-log-input'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-build4-log-source'
          output=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'output/seven-build4-log-capability'
          output.mkdir(parents=True)
          expected={'ci_seven_ios_build4_export.sh': '3c9d8e7e5439a8d4ee03064e36c79c329700fc58d711cb906a025a9563f83e0c', 'ci_verify_seven_build4.py': '46ccdb1bf5a66b3a96cf0603bbf41a82385234d0e056ef128d680b380b1b4dcd', 'seven-district-reckoning-build4-source-verification.json': '9db1c21d3560cfbd1dcf1d2b5fc4eaf9cb1da5c19c1425c0cb5ed6494434b0af', 'SevenDistrict-1.0.0-build4-unsigned-source.zip': 'f20681b369bdd2d451ea537615c8022e2df048bc2b390f660057d46ae0397696', 'SHA256SUMS': '059fd419f23dbcac7a4a56df9ca534604d3aee08634eab32c998a14b0d895c2a'}
          for name,digest in expected.items():
              if hashlib.sha256((base/name).read_bytes()).hexdigest()!=digest:raise SystemExit('Immutable input differs')
          if hashlib.sha256(pathlib.Path('scripts/seven-ios-log-capability.py').read_bytes()).hexdigest()!='4580e333dec8a098eeb40836f7dcc3429dfa1840a8de6372f30814de31f3bd6d':raise SystemExit('Reviewed runner differs')
          subprocess.run(['python3',str(base/'ci_verify_seven_build4.py'),'source','--zip',str(base/'SevenDistrict-1.0.0-build4-unsigned-source.zip'),'--metadata',str(base/'seven-district-reckoning-build4-source-verification.json'),'--project','seven-district-reckoning','--root',str(root),'--output',str(output/'source-relay-verification.json')],check=True,timeout=300)
          (output/'input-provenance.json').write_bytes((base/'input-provenance.json').read_bytes())
          PYCODE
      - name: One help-first owned Simulator log capability and cold frame
        run: |
          python3 scripts/seven-ios-log-capability.py --source "$RUNNER_TEMP/seven-build4-log-source" --metadata "$RUNNER_TEMP/seven-build4-log-input/seven-district-reckoning-build4-source-verification.json" --verifier "$RUNNER_TEMP/seven-build4-log-input/ci_verify_seven_build4.py" --output "$GITHUB_WORKSPACE/output/seven-build4-log-capability/probe"
      - name: Cleanup only these owned source input paths
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,shutil
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          for name in ['seven-build4-log-input','seven-build4-log-source']:
              target=parent/name
              if target.resolve()!=parent and target.resolve().is_relative_to(parent) and not target.is_symlink():shutil.rmtree(target,ignore_errors=True)
          PYCODE
      - name: Public capability facts and original cold frame only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seven-build4-log-capability-${{ github.run_id }}
          path: |
            output/seven-build4-log-capability/input-provenance.json
            output/seven-build4-log-capability/source-relay-verification.json
            output/seven-build4-log-capability/probe/*.json
            output/seven-build4-log-capability/probe/cold-diagnostic-raw.png
          retention-days: 14
          if-no-files-found: error
