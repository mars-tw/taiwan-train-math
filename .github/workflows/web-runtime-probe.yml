name: Ashes Simulator gameplay recording (unsigned, no store submission)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ashes-simulator-recording-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    if: github.repository == 'mars-tw/taiwan-train-math' && github.ref == 'refs/heads/codex/ashes-simulator-recording'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: scripts/fetch-ashes-recording-source.py
          sparse-checkout-cone-mode: false
      - name: Fetch only the fixed same-repository draft source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-ashes-recording-source.py fetch --directory "$RUNNER_TEMP/ashes-recording-input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ashes-recording-input-${{ github.run_id }}
          path: ${{ runner.temp }}/ashes-recording-input
          if-no-files-found: error
          retention-days: 1
  record:
    needs: fetch
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/fetch-ashes-recording-source.py
            scripts/record-ashes-ios-simulator.py
            scripts/create-ashes-simulator-capture-project.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ashes-recording-input-${{ github.run_id }}
          path: ${{ runner.temp }}/ashes-recording-input
      - name: Set paths from the actual runner environment
        run: |
          echo "CI_TOOLS=$RUNNER_TEMP/ashes-recording-input" >> "$GITHUB_ENV"
          echo "APP_SOURCE=$RUNNER_TEMP/ashes-recording-source" >> "$GITHUB_ENV"
          echo "PUBLIC_OUTPUT=$GITHUB_WORKSPACE/output/ashes-simulator-recording" >> "$GITHUB_ENV"
      - name: Verify exact same-run source and safely extract it
        run: |
          python3 scripts/fetch-ashes-recording-source.py verify --directory "$CI_TOOLS"
          python3 "$CI_TOOLS/ci_verify_ios.py" extract --zip "$CI_TOOLS/ashes-convoy-ios-source.zip" --destination "$APP_SOURCE"
          mkdir -p "$PUBLIC_OUTPUT"
          python3 "$CI_TOOLS/ci_verify_ios.py" source --root "$APP_SOURCE" --project ashes-convoy --output "$PUBLIC_OUTPUT/source-verification.json"
          cp "$CI_TOOLS/recording-input-provenance.json" "$PUBLIC_OUTPUT/input-provenance.json"
      - name: Prepare frozen native source without any Apple signing credentials
        run: bash "$CI_TOOLS/ci_ios_export.sh" prepare "$APP_SOURCE" ashes-convoy "$PUBLIC_OUTPUT"
      - name: Record a continuous real Simulator launch and normal native XCTest controls
        run: python3 scripts/record-ashes-ios-simulator.py --app-source "$APP_SOURCE" --output "$PUBLIC_OUTPUT" --source-zip "$CI_TOOLS/ashes-convoy-ios-source.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ashes-ios-simulator-recording-${{ github.run_id }}
          path: ${{ github.workspace }}/output/ashes-simulator-recording
          if-no-files-found: error
          retention-days: 7
