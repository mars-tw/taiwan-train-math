name: Ashes owned Simulator recorder startup diagnostic (no gameplay)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ashes-recorder-startup-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'mars-tw/taiwan-train-math' && github.ref == 'refs/heads/codex/ashes-simulator-recording'
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/record-ashes-ios-simulator.py
            scripts/diagnose-ashes-simulator-recorder-startup.py
            .github/workflows/web-runtime-probe.yml
          sparse-checkout-cone-mode: false
      - name: Observe one owned recorder startup without game build or launch
        run: python3 scripts/diagnose-ashes-simulator-recorder-startup.py --output "$GITHUB_WORKSPACE/output/ashes-recorder-startup-diagnostic"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ashes-recorder-startup-diagnostic-${{ github.run_id }}
          path: ${{ github.workspace }}/output/ashes-recorder-startup-diagnostic
          if-no-files-found: error
          retention-days: 7
